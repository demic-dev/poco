# Unsigned for Apple, ad-hoc signed with entitlements: SideStore reads the
# entitlements (the App Group) from the signature, then signs it for real.
build:
  name: iOS build for SideStore
  steps:
    - eas/checkout
    - eas/install_node_modules
    - eas/prebuild
    - run:
        name: Install pods
        working_directory: ./ios
        command: pod install
    - run:
        name: Build without signing
        working_directory: ./ios
        command: |
          xcodebuild -workspace poco.xcworkspace -scheme poco -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
    - run:
        name: Ad-hoc sign and package
        working_directory: ./ios
        command: |
          set -e
          app=build/Build/Products/Release-iphoneos/poco.app
          find "$app" -depth \( -name '*.framework' -o -name '*.dylib' \) -exec codesign -f -s - {} \;
          codesign -f -s - --entitlements .targets/widget/generated.entitlements "$app"/PlugIns/*.appex
          codesign -f -s - --entitlements poco/poco.entitlements "$app"
          codesign -d --entitlements - "$app" "$app"/PlugIns/*.appex
          mkdir -p Payload && cp -R "$app" Payload/ && zip -qr ../poco.ipa Payload
    - eas/upload_artifact:
        inputs:
          type: application-archive
          path: poco.ipa
